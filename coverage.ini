[run]
branch = True
# "source" defines which code we measure; list every top-level component
source =
    orchestration
    another_component
    # add more components here as needed

# Omit typical non-code dirs
omit =
    */bin/*
    */config_*.py
    */tests/*
    */__init__.py
    */.venv/*
    */venv/*
    ./venv/*
    */build/*
    */dist/*

[report]
show_missing = True
skip_covered = True
# Fail if total coverage is below this threshold (optional)
# fail_under = 80

[html]
directory = htmlcov

[xml]
output = coverage.xml
